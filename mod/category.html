<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Category — Moderator · TipTop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@100..800&family=Parkinsans:wght@300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css">
<link rel="stylesheet" href="mod.css">
</head>
<body class="page-category page-mod">
<script>window.SHOPCRAFT_MOD_CATALOG = true;</script>

<header>
  <div class="header-inner">
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <img src="../TipTop%20Logo.jpg" alt="TipTop logo">
      </div>
      <span class="logo-text">Tip<span>Top</span></span>
    </a>
    <nav class="nav-shell" aria-label="Moderator navigation">
      <div class="nav-links">
        <div id="nav-category-links" class="nav-category-links"></div>
        <div id="nav-more" class="nav-more" hidden>
          <button type="button" id="nav-more-btn" class="nav-more-btn" aria-expanded="false" aria-haspopup="true">
            More ▾
          </button>
          <div id="nav-more-menu" class="nav-more-menu" role="menu" aria-label="More categories"></div>
        </div>
      </div>
      <a href="../index.html" class="storefront-link">← Public catalog</a>
    </nav>
  </div>
</header>

<div class="page-hero">
  <div class="page-hero-inner">
    <div class="breadcrumb">
      <a href="index.html">Moderator home</a> › <span id="catalog-breadcrumb-current">…</span>
    </div>
    <h1 class="page-title" id="catalog-page-title">Loading…</h1>
    <p class="page-subtitle" id="catalog-page-subtitle"></p>
    <div class="page-meta">
      <span class="product-count" id="catalog-count-products">—</span>
      <span class="product-count" id="catalog-sku-range"></span>
    </div>
  </div>
</div>

<div class="main-content">
  <div class="product-grid" id="productGrid"></div>
  <div class="pagination" id="pagination"></div>
</div>

<footer>
  <div class="footer-simple">
    <span class="logo-text">Tip<span style="color:#93c5fd">Top</span></span>
    <p>Copy product messages to clipboard — same catalog as the public site.</p>
    <a href="../index.html" class="footer-messenger-btn mod-footer-link">← Customer storefront</a>
    <p class="footer-copy">Moderator · TipTop</p>
  </div>
</footer>

<script src="../shopcraft-supabase-config.js"></script>
<script src="../shopcraft-api.js"></script>
<script src="../site-nav-categories.js" defer></script>
<script src="../catalog-cart.js" defer></script>
</body>
</html>
